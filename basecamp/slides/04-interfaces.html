<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>04 Interfaces</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
h1.slide-title{margin-top:135px;}
.uis{display:flex;gap:34px;margin-top:56px;align-items:stretch;}

.ui .pic{height:690px;overflow:hidden;} .ui .pic img{width:100%;height:100%;object-fit:cover;display:block;}

.ui .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;color:var(--navy);line-height:1;}
.ui .lbl{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:25px;letter-spacing:2.5px;text-transform:uppercase;}
.u1 .lbl{color:#1a5276;} .u2 .lbl{color:#B54A00;} .u3 .lbl{color:#1a6b2d;}
.ui.today{border:7px solid var(--gold);}

<body class="light">

<div class="stripe"></div>
<div class="tag">The Map</div>
<h1 class="slide-title">Three ways to <span class="gold">drive your AI.</span></h1>
<div class="uis">
  <div class="ui u1"><div class="pic"><img src="../assets/ui/easy-button.jpg" alt="A finger pressing a big red easy button"></div></div>
  <div class="ui u2 today"><div class="pic"><img src="../assets/ui/driver-seat.jpg" alt="A car’s driver seat: wheel, dash, mirrors"></div></div>
  <div class="ui u3"><div class="pic"><img src="../assets/ui/flight-deck.jpg" alt="The space shuttle Endeavour flight deck"></div></div>
</div>
