<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>04 Interfaces</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
h1.slide-title{margin-top:135px;}
.uis{display:flex;gap:34px;margin-top:60px;align-items:stretch;}
.ui{flex:1;background:#fff;border:1px solid #E5E7EB;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;}
.ui .pic{height:470px;overflow:hidden;} .ui .pic img{width:100%;height:100%;object-fit:cover;display:block;}
.ui .cap{padding:24px 36px 30px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;}
.ui .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;color:var(--navy);line-height:1;}
.ui .lbl{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:25px;letter-spacing:2.5px;text-transform:uppercase;}
.u1 .lbl{color:#1a5276;} .u2 .lbl{color:#B54A00;} .u3 .lbl{color:#1a6b2d;}
.ui.today{border:7px solid var(--gold);}
</style></head>
<body class="light">

<div class="stripe"></div>
<div class="tag">The Map</div>
<h1 class="slide-title">Same engine. <span class="gold">Three cockpits.</span></h1>
<div class="uis">
  <div class="ui u1"><div class="pic"><img src="../assets/ui/easy-button.jpg" alt="A finger pressing a big red easy button"></div><div class="cap"><div class="nm">Easy button</div><div class="lbl">Crawl</div></div></div>
  <div class="ui u2 today"><div class="pic"><img src="../assets/ui/driver-seat.jpg" alt="A car’s driver seat: wheel, dash, mirrors"></div><div class="cap"><div class="nm">Driver’s seat</div><div class="lbl">Walk</div></div></div>
  <div class="ui u3"><div class="pic"><img src="../assets/ui/flight-deck.jpg" alt="The space shuttle Endeavour flight deck"></div><div class="cap"><div class="nm">Flight deck</div><div class="lbl">Run</div></div></div>
</div>
<div class="takeaway">Most of the room is on the easy button. <b>Today you get the driver’s seat.</b></div>
<div class="num">4</div>
</body></html>
