<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>09 Deepfake</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body{display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .setup{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:40px;
    color:rgba(255,255,255,.9);margin-bottom:34px;
  }
  .player{
    width:1240px;border-radius:18px;overflow:hidden;background:#000;
    border:1px solid rgba(255,255,255,.18);position:relative;cursor:pointer;
  }
  .player video{display:block;width:100%;}
  .player .playbtn{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:130px;height:130px;border-radius:50%;background:rgba(10,26,47,.75);
    border:4px solid #fff;display:flex;align-items:center;justify-content:center;
    transition:opacity .2s;pointer-events:none;
  }
  .player .playbtn svg{margin-left:10px;}
  .player.playing .playbtn{opacity:0;}
</style></head>
<body class="dark">
<div class="accent"></div>
<div class="setup">Before we go on... a quick thank-you from Alane and the Chamber.</div>
<div class="player" id="player">
  <video id="alane" poster="../assets/deepfake-poster.jpg" preload="metadata" playsinline controls>
    <source src="../assets/alane-deepfake.mp4" type="video/mp4">
  </video>
  <div class="playbtn"><svg width="52" height="52" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
</div>
<div class="num">14</div>
<script>
  (function(){
    var p = document.getElementById('player'), v = document.getElementById('alane');
    p.addEventListener('click', function(e){
      // let native control clicks (bottom bar) behave normally; big-target click toggles
      if (v.paused) { v.play(); } else { v.pause(); }
    });
    v.addEventListener('play',  function(){ p.classList.add('playing'); });
    v.addEventListener('pause', function(){ p.classList.remove('playing'); });
    v.addEventListener('ended', function(){ p.classList.remove('playing'); });
  })();
</script>
</body></html>
