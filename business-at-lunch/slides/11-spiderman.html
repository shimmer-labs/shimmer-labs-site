<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>09 Great Power</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  body{display:flex;align-items:center;}
  .wrap{display:flex;gap:70px;align-items:center;width:100%;}
  .art{flex:0.85;flex-shrink:0;}
  .art img{width:100%;max-height:860px;object-fit:contain;border-radius:16px;}
  .art .ph{
    height:820px;border-radius:16px;background:#13253d;border:4px dashed #3d5573;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:#B8C4D4;font-size:26px;font-style:italic;padding:40px;line-height:1.5;
  }
  .art .ph b{color:#fff;display:block;font-style:normal;font-size:30px;margin-bottom:12px;}
  .txt{flex:1;}
  blockquote{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:62px;line-height:1.12;}
  blockquote .gold{color:var(--gold);}
  .attr{font-size:24px;color:rgba(255,255,255,.55);margin-top:20px;font-style:italic;}
  .turn{font-size:34px;font-weight:500;margin-top:44px;color:rgba(255,255,255,.92);}
  .turn b{color:var(--gold);}
</style></head>
<body class="dark">
<div class="accent"></div>
<div class="wrap">
  <div class="art">
    <img src="../assets/spiderman.png" alt="">
  </div>
  <div class="txt">
    <blockquote>&ldquo;With great power comes <span class="gold">great responsibility.&rdquo;</span></blockquote>
    <div class="attr">— Uncle Ben</div>
    <div class="turn">Every tool has two sides. Nuclear power, or a bomb.<br>We got a huge upgrade. <b>So did the bad guys.</b></div>
  </div>
</div>
<div class="num">11</div>
</body></html>
