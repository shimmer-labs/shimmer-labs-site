<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI for Every Business — Chamber Business@Lunch</title>
<style>
  :root { --s: 1; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: absolute; top: 50%; left: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s));
    transform-origin: center center;
  }
  #stage iframe {
    position: absolute; inset: 0; width: 1920px; height: 1080px;
    border: 0; background: #0A1A2F; display: none;
  }
  #stage iframe.active { display: block; }

  /* black-screen overlay (press B) */
  #black {
    position: fixed; inset: 0; background: #000; z-index: 40;
    display: none;
  }
  #black.on { display: block; }

  /* loading */
  #loading {
    position: fixed; inset: 0; z-index: 50; background: #0A1A2F; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; letter-spacing: .5px;
  }
  #loading .dot { color: #FDBE34; }
  #loading.hidden { display: none; }

  /* controls */
  #controls {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 30; display: flex; align-items: center; gap: 14px;
    background: rgba(10,26,47,.82); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 10px 16px; color: #fff;
    opacity: 0; transition: opacity .25s; pointer-events: none;
    backdrop-filter: blur(6px);
  }
  #controls.show { opacity: 1; pointer-events: auto; }
  #controls button {
    background: transparent; border: 0; color: #fff; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #controls button:hover { background: rgba(255,255,255,.14); }
  #counter {
    font-family: "Space Grotesk", sans-serif; font-size: 17px;
    min-width: 66px; text-align: center; color: #E5E7EB; letter-spacing: 1px;
  }
  #counter b { color: #FDBE34; }

  /* edge click arrows (big invisible hit zones) */
  .edge {
    position: fixed; top: 0; bottom: 0; width: 12%; z-index: 20; cursor: pointer;
    display: flex; align-items: center; opacity: 0; transition: opacity .2s;
    color: #fff; font-size: 40px; user-select: none;
  }
  .edge.left { left: 0; justify-content: flex-start; padding-left: 20px; }
  .edge.right { right: 0; justify-content: flex-end; padding-right: 20px; }
  .edge:hover { opacity: .55; }

  #hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 30; color: rgba(255,255,255,.75); font-size: 15px;
    background: rgba(10,26,47,.7); padding: 8px 16px; border-radius: 999px;
    transition: opacity .4s;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
  <div id="stage"></div>

  <div class="edge left"  id="prevEdge">‹</div>
  <div class="edge right" id="nextEdge">›</div>

  <div id="black"></div>

  <div id="controls">
    <button id="prevBtn" title="Previous (←)">‹</button>
    <div id="counter"><b>1</b> / 24</div>
    <button id="nextBtn" title="Next (→)">›</button>
    <button id="fsBtn" title="Fullscreen (F)">⛶</button>
  </div>

  <div id="hint">← → or clicker to move &nbsp;·&nbsp; <b style="color:#FDBE34">F</b> fullscreen &nbsp;·&nbsp; <b style="color:#FDBE34">B</b> black screen</div>

  <div id="loading">Loading the deck<span class="dot">…</span></div>

<script>
(function () {
  var SLIDES = [
    "01-title","02-adoption","03-sherpa","04-engagement","05-crawl-walk-run",
    "06-gym","07-why-it-works","08-landscaper","09-more-stories","10-eye-roll",
    "11-spiderman","12-scam-phd","13-the-stat","14-deepfake","15-how-easy",
    "16-you-got-scammed","17-fake-employee","18-fake-meeting","19-fake-invoice",
    "20-weakest-link","21-habits","22-tech-tuneup","23-recap","24-close"
  ];

  var stage = document.getElementById("stage");
  var counter = document.getElementById("counter");
  var loading = document.getElementById("loading");
  var controls = document.getElementById("controls");
  var hint = document.getElementById("hint");
  var frames = [];
  var idx = 0;
  var firstLoaded = false;

  // build one iframe per slide, all preloaded so transitions are instant
  SLIDES.forEach(function (name, i) {
    var f = document.createElement("iframe");
    f.setAttribute("scrolling", "no");
    f.src = "slides/" + name + ".html";
    if (i === 0) f.className = "active";
    f.addEventListener("load", function () {
      if (i === 0 && !firstLoaded) { firstLoaded = true; loading.classList.add("hidden"); }
      // forward key + wheel events from inside same-origin iframes to the top handler
      try {
        var w = f.contentWindow;
        w.addEventListener("keydown", onKey);
      } catch (e) { /* cross-origin (won't happen when hosted same-domain) */ }
    });
    frames.push(f);
    stage.appendChild(f);
  });

  function pauseVideosIn(i) {
    try {
      var vids = frames[i].contentDocument.querySelectorAll("video");
      vids.forEach(function (v) { v.pause(); });
    } catch (e) {}
  }

  function show(n) {
    n = Math.max(0, Math.min(SLIDES.length - 1, n));
    if (n === idx) return;
    pauseVideosIn(idx);
    frames[idx].classList.remove("active");
    idx = n;
    frames[idx].classList.add("active");
    counter.innerHTML = "<b>" + (idx + 1) + "</b> / " + SLIDES.length;
    focusTop();
  }
  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }

  function focusTop() { try { window.focus(); } catch (e) {} }

  var black = document.getElementById("black");
  function toggleBlack() { black.classList.toggle("on"); }

  function toggleFS() {
    var d = document, el = d.documentElement;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } else {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    }
  }

  function onKey(e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Spacebar") {
      e.preventDefault(); next();
    } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace") {
      e.preventDefault(); prev();
    } else if (k === "Home") { e.preventDefault(); show(0); }
    else if (k === "End")  { e.preventDefault(); show(SLIDES.length - 1); }
    else if (k === "f" || k === "F") { e.preventDefault(); toggleFS(); }
    else if (k === "b" || k === "B" || k === ".") { e.preventDefault(); toggleBlack(); }
  }
  window.addEventListener("keydown", onKey);

  // scale stage to fit viewport
  function resize() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.setProperty("--s", s);
  }
  window.addEventListener("resize", resize);
  resize();

  // click zones + buttons
  document.getElementById("prevEdge").addEventListener("click", prev);
  document.getElementById("nextEdge").addEventListener("click", next);
  document.getElementById("prevBtn").addEventListener("click", prev);
  document.getElementById("nextBtn").addEventListener("click", next);
  document.getElementById("fsBtn").addEventListener("click", toggleFS);

  // auto-hide controls after inactivity
  var hideTimer;
  function poke() {
    controls.classList.add("show");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { controls.classList.remove("show"); }, 2600);
  }
  window.addEventListener("mousemove", poke);
  poke();

  // fade the hint after a few seconds
  setTimeout(function () { hint.classList.add("hidden"); }, 5000);
})();
</script>
</body>
</html>
