<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Slide — The Real Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; background: #111; overflow: hidden; }
        body {
            width: 1920px; height: 1080px;
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0A1A2F; color: #FFFFFF;
            overflow: hidden; position: relative; transform-origin: top left;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(253, 190, 52, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(253, 190, 52, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }
        .accent-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #FDBE34, #F5A623, #FDBE34);
        }
        .slide-number {
            position: absolute; bottom: 40px; right: 60px;
            font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 500;
            color: rgba(255,255,255,0.4); z-index: 2;
        }

        .slide-content {
            position: relative; z-index: 1;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 56px 120px;
        }
        .section-tag {
            font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase; color: #FDBE34;
            background: rgba(253, 190, 52, 0.1); border: 1px solid rgba(253, 190, 52, 0.3);
            display: inline-block; padding: 6px 16px;
            border-radius: 4px; margin-bottom: 20px;
        }
        .slide-title {
            font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 700;
            color: #FFFFFF; margin-bottom: 12px; text-align: center;
        }
        .slide-title em { color: #FDBE34; font-style: italic; }
        .slide-subtitle {
            font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 400;
            color: rgba(255,255,255,0.6); margin-bottom: 36px; text-align: center;
        }
        .slide-subtitle span { color: #FDBE34; }

        .image-container {
            border-radius: 12px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .image-container img {
            display: block;
            max-height: 560px;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>

    <div class="slide-content">
        <div class="section-tag">The Lay of the Land</div>
        <div class="slide-title">This Is What It <em>Really</em> Looks Like</div>
        <div class="slide-subtitle">We're not doing a dissertation on this. Here's my oversimplified version <span>&rarr;</span></div>

        <div class="image-container">
            <img src="../assets/reference-architecture-genAI.jpg"
                 alt="Reference architecture diagram for Generative AI systems">
        </div>
    </div>

    <div class="slide-number">06</div>

    <script>
        function scaleSlide() {
            const sw = 1920, sh = 1080;
            const scale = Math.min(window.innerWidth / sw, window.innerHeight / sh);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.transformOrigin = 'top left';
            document.body.style.marginLeft = `${(window.innerWidth - sw * scale) / 2}px`;
            document.body.style.marginTop = `${(window.innerHeight - sh * scale) / 2}px`;
        }
        scaleSlide();
        window.addEventListener('resize', scaleSlide);
    </script>
</body>
</html>
