<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Title Slide — AI Security in Higher Education</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        body {
            width: 1920px;
            height: 1080px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A1A2F;
            color: #FFFFFF;
            overflow: hidden;
            position: relative;
            transform-origin: top left;
        }

        /* Subtle grid pattern overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(253, 190, 52, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(253, 190, 52, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Gold accent line at top */
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #FDBE34, #F5A623, #FDBE34);
        }

        .slide-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 140px;
        }

        /* Shimmer sparkle decorations */
        .sparkle {
            position: absolute;
            z-index: 1;
        }
        .sparkle svg { display: block; }

        .sparkle-1 { top: 80px; right: 200px; opacity: 0.6; }
        .sparkle-2 { top: 180px; right: 320px; opacity: 0.3; }
        .sparkle-3 { bottom: 200px; right: 160px; opacity: 0.4; }
        .sparkle-4 { bottom: 340px; left: 100px; opacity: 0.15; }

        .title-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #FDBE34;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 72px;
            font-weight: 700;
            line-height: 1.1;
            color: #FFFFFF;
            margin-bottom: 16px;
            max-width: 1100px;
        }

        h1 .highlight {
            color: #FDBE34;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 28px;
            font-weight: 400;
            color: #E5E7EB;
            margin-bottom: 60px;
            max-width: 800px;
        }

        .presenter-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .presenter-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
        }

        .presenter-divider {
            width: 2px;
            height: 28px;
            background: #FDBE34;
        }

        .presenter-company {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: #E5E7EB;
        }

        /* Logo row at bottom */
        .logo-row {
            position: absolute;
            bottom: 60px;
            left: 140px;
            right: 140px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shimmer-logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .shimmer-logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .shimmer-logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 1px;
        }

        .osu-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .osu-wordmark {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #FF6600;
            letter-spacing: 1px;
        }

        .osu-subtext {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #6B7280;
        }

        .osu-mark {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>

    <!-- Shimmer sparkle decorations -->
    <div class="sparkle sparkle-1">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#FDBE34"/>
        </svg>
    </div>
    <div class="sparkle sparkle-2">
        <svg width="20" height="20" viewBox="0 0 40 40" fill="none">
            <path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#FDBE34"/>
        </svg>
    </div>
    <div class="sparkle sparkle-3">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#FDBE34"/>
        </svg>
    </div>
    <div class="sparkle sparkle-4">
        <svg width="16" height="16" viewBox="0 0 40 40" fill="none">
            <path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#FDBE34"/>
        </svg>
    </div>

    <div class="slide-content">
        <div class="title-label">Faculty & Staff Workshop</div>
        <h1>Using AI <span class="highlight">Securely</span> in Higher Education</h1>
        <p class="subtitle">Practical tips, real-world risks, and live prompt engineering demos</p>
        <div class="presenter-info">
            <span class="presenter-name">Logan Shimmer</span>
            <div class="presenter-divider"></div>
            <span class="presenter-company">Shimmer Labs</span>
        </div>
    </div>

    <div class="logo-row">
        <!-- Shimmer Labs logo -->
        <div class="shimmer-logo">
            <img class="shimmer-logo-icon" src="../assets/shimmer-labs-logo.png" alt="Shimmer Labs">
            <span class="shimmer-logo-text">SHIMMER LABS</span>
        </div>

        <!-- OSU logo -->
        <div class="osu-logo">
            <img src="../assets/okstate-logo.png" alt="Oklahoma State University" style="height: 56px; width: auto;">
        </div>
    </div>

    <script>
        function scaleSlide() {
            const sw = 1920, sh = 1080;
            const scale = Math.min(window.innerWidth / sw, window.innerHeight / sh);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.transformOrigin = 'top left';
            document.body.style.marginLeft = `${(window.innerWidth - sw * scale) / 2}px`;
            document.body.style.marginTop = `${(window.innerHeight - sh * scale) / 2}px`;
        }
        scaleSlide();
        window.addEventListener('resize', scaleSlide);
    </script>
</body>
</html>
