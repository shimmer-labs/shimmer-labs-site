<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Slide — Transition to Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; background: #111; overflow: hidden; }
        body {
            width: 1920px; height: 1080px;
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0A1A2F; color: #FFFFFF;
            overflow: hidden; position: relative; transform-origin: top left;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(253, 190, 52, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(253, 190, 52, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }
        .accent-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, #FDBE34, #F5A623, #FDBE34);
        }
        .slide-number {
            position: absolute; bottom: 40px; right: 60px;
            font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.4);
        }

        .slide-content {
            position: relative; z-index: 1;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 80px 160px;
        }

        .recap-flow {
            display: flex; align-items: center; justify-content: center;
            gap: 0; margin-bottom: 64px;
        }
        .recap-box {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; padding: 28px 36px;
            text-align: center; min-width: 240px;
        }
        .recap-box .icon { margin-bottom: 12px; }
        .recap-box .label {
            font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600;
            color: #FFFFFF;
        }
        .recap-box .sub {
            font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 400;
            color: rgba(255,255,255,0.5); margin-top: 6px;
        }
        .recap-box.danger {
            background: rgba(220, 53, 69, 0.12); border-color: rgba(220, 53, 69, 0.4);
        }
        .recap-box.danger .label { color: #DC3545; }

        .flow-arrow {
            font-family: 'Space Grotesk', sans-serif; font-size: 32px;
            color: rgba(255,255,255,0.3); padding: 0 20px;
        }

        .pivot-line {
            font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 700;
            color: #FFFFFF; text-align: center; line-height: 1.4;
            max-width: 1200px;
        }
        .pivot-line em {
            color: #FDBE34; font-style: normal;
        }
        .pivot-line .red {
            color: #DC3545;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>

    <div class="slide-content">
        <div class="recap-flow">
            <div class="recap-box">
                <div class="icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div class="label">Training Data</div>
                <div class="sub">Books, code, the web</div>
            </div>

            <div class="flow-arrow">&rarr;</div>

            <div class="recap-box">
                <div class="icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF6600" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div class="label">Your Conversations</div>
                <div class="sub">Also training data</div>
            </div>

            <div class="flow-arrow">&rarr;</div>

            <div class="recap-box danger">
                <div class="icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#DC3545" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                </div>
                <div class="label">???</div>
                <div class="sub">What could go wrong?</div>
            </div>
        </div>

        <div class="pivot-line">
            So AI predicts words from <em>massive training data</em> ...<br>
            including <em>your conversations</em>.<br>
            What happens when that goes <span class="red">wrong</span>?
        </div>
    </div>

    <div class="slide-number">10</div>

    <script>
        function scaleSlide() {
            const sw = 1920, sh = 1080;
            const scale = Math.min(window.innerWidth / sw, window.innerHeight / sh);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.transformOrigin = 'top left';
            document.body.style.marginLeft = `${(window.innerWidth - sw * scale) / 2}px`;
            document.body.style.marginTop = `${(window.innerHeight - sh * scale) / 2}px`;
        }
        scaleSlide();
        window.addEventListener('resize', scaleSlide);
    </script>
</body>
</html>
