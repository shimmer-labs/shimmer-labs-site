title: Project
fields:
  meta_description:
    label: Meta Description (SEO)
    type: textarea
    maxlength: 160
    help: Appears in search results. If empty, uses summary field.
  og_image:
    label: Open Graph Image (Social Sharing)
    type: files
    max: 1
    help: Image for social media sharing (recommended 1200x630px). Falls back to project image if empty.
  featured:
    type: toggle
    label: Featured Project
    help: Show in featured section on projects page (highlight your best work)
    default: false
  summary: textarea
  tech_stack: tags
  results: textarea
  link:
    type: url
    label: Project Link
    help: GitHub repo, live demo, or project URL
  app_store_url:
    type: url
    label: App Store URL (for iOS apps)
    help: Apple App Store link (optional)
  is_app:
    type: toggle
    label: Is this an iOS/mobile app?
    help: Shows App Store download button and legal links
    default: false
  demo_video:
    type: files
    label: Demo Video/GIF
    help: Upload a demo video (.mp4, .mov, .webm) or GIF showing the app in action
    max: 1
    accept:
      - video/mp4
      - video/quicktime
      - video/webm
      - image/gif
  image: files