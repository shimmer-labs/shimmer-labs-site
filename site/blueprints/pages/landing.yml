title: Landing Page

columns:
  - width: 2/3
    sections:
      content:
        type: fields
        fields:
          hero_label:
            label: Hero Label
            type: text
            placeholder: "Free Guide"
          hero_title:
            label: Hero Title
            type: text
            placeholder: "Too Many Hats, Not Enough Hours"
          hero_description:
            label: Hero Description
            type: textarea
            size: small
          hero_cta:
            label: CTA Button Text
            type: text
            placeholder: "Download the Free Guide →"

          line1:
            type: line

          bullets_title:
            label: What You'll Learn Title
            type: text
            placeholder: "Inside this guide:"
          bullets:
            label: Bullet Points
            type: structure
            fields:
              text:
                label: Bullet Text
                type: text

          line2:
            type: line

          form_heading:
            label: Form Heading
            type: text
            placeholder: "Get Your Free Copy"
          form_subheading:
            label: Form Subheading
            type: text
            placeholder: "We'll email the guide to you instantly."
          intent_label:
            label: Intent Question
            type: text
            help: "The one qualifying question on the form (varies per guide)"
            placeholder: "What eats up most of your week?"
          intent_options:
            label: Intent Answer Options
            type: textarea
            size: small
            help: "One answer per line. Rendered as a dropdown."
          whitepaper_slug:
            label: Whitepaper Slug
            type: text
            help: "Used for tracking which guide was downloaded"
            placeholder: "ai-agents-small-business"

          line3:
            type: line

          social_proof_text:
            label: Social Proof Text
            type: text
            placeholder: "Join 200+ business owners using AI responsibly"

          line4:
            type: line

          thank_you_title:
            label: Thank You Title
            type: text
            placeholder: "Check your inbox!"
          thank_you_description:
            label: Thank You Description
            type: textarea
            size: small

          line5:
            type: line

          who_for:
            label: Who This Guide Is For
            type: textarea
            size: small
            help: "Ungated content shown below the form. Aids SEO + LLM understanding."
          key_takeaways:
            label: Key Takeaways
            type: structure
            help: "3-5 takeaways. Add a source for any stat (helps AI citations)."
            fields:
              text:
                label: Takeaway
                type: text
              source_name:
                label: Source name (optional)
                type: text
              source_url:
                label: Source URL (optional)
                type: url
          pull_quote:
            label: Pull Quote / Stat Callout
            type: text
          pull_quote_attribution:
            label: Pull Quote Attribution
            type: text
          faq:
            label: FAQ
            type: structure
            help: "Questions phrased the way people search. Rendered as plain HTML."
            fields:
              question:
                label: Question
                type: text
              answer:
                label: Answer
                type: textarea
                size: small

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          seo_title:
            label: SEO Title
            type: text
            maxlength: 65
            help: "Overrides the page <title>. Keyword-front-loaded, ~55-60 chars."
          meta_description:
            label: Meta Description
            type: text
            maxlength: 160
          og_image:
            label: OG Image
            type: files
            max: 1
